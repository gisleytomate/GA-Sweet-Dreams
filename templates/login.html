
{% extends "base.html" %}

{% block titulo %}
Acceso de dueños | G&A Sweet Dreams
{% endblock %}

{% block contenido %}

<section class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7 col-lg-5">

            <div class="card sweet-card shadow-sm">

                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">

                        <div style="font-size: 50px;">
                            🔐
                        </div>

                        <h1 class="sweet-heading">
                            Acceso de dueños
                        </h1>

                        <p class="text-muted">
                            Bienvenido al área privada
                            de G&A Sweet Dreams.
                        </p>

                    </div>

                    {% if error %}
                    <div class="alert alert-danger"
                         role="alert">
                        {{ error }}
                    </div>
                    {% endif %}

                    <form method="POST"
                          action="{{ url_for('login') }}">

                          <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">

                            <label for="usuario"
                                   class="form-label">
                                Usuario
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="usuario"
                                   name="usuario"
                                   placeholder="Ingresa tu usuario"
                                   autocomplete="username"
                                   required>

                        </div>

                        <div class="mb-4">

                            <label for="contrasena"
                                   class="form-label">
                                Contraseña
                            </label>

                            <input type="password"
                                   class="form-control"
                                   id="contrasena"
                                   name="contrasena"
                                   placeholder="Ingresa tu contraseña"
                                   autocomplete="current-password"
                                   required>

                        </div>

                        <button type="submit"
                                class="btn btn-dorado w-100">
                            Iniciar sesión
                        </button>

                    </form>

                    <div class="text-center mt-4">

                        <a href="{{ url_for('inicio') }}"
                           class="text-decoration-none">
                            ← Volver a la tienda
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
