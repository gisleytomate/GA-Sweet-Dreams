
{% extends "base.html" %}

{% block contenido %}

<div class="container py-5">

    <div class="text-center mb-5">
        <h1 class="sweet-heading">
            💗 Finalizar mi pedido
        </h1>
        <p class="text-muted">
            Completa tus datos para preparar tus dulces favoritos.
        </p>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card sweet-card">
                <div class="card-body p-4">

                    <h4 class="sweet-heading mb-4">
                        🧁 Datos del cliente
                    </h4>

                    <form method="post"
                          action="{{ url_for('finalizar_pedido') }}">

                        <input type="hidden"
                               name="_csrf_token"
                               value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label class="form-label">
                                Nombre completo
                            </label>
                            <input type="text"
                                   name="nombre"
                                   class="form-control"
                                   maxlength="100"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Teléfono
                            </label>
                            <input type="tel"
                                   name="telefono"
                                   class="form-control"
                                   maxlength="20"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Dirección de entrega
                            </label>
                            <textarea name="direccion"
                                      class="form-control"
                                      rows="3"
                                      maxlength="300"
                                      required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Fecha de entrega solicitada
                            </label>
                            <input type="date"
                                   name="fecha_entrega"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">
                                Indicaciones especiales
                            </label>
                            <textarea name="observaciones"
                                      class="form-control"
                                      rows="3"
                                      maxlength="500"
                                      placeholder="Ejemplo: escribir Feliz cumpleaños en el pastel"></textarea>
                        </div>

                        <div class="text-center">
                            <button type="submit"
                                    class="btn btn-dorado px-5">
                                💗 Confirmar pedido
                            </button>
                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

{% endblock %}
